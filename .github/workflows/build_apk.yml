name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r scripts/requirements.txt
      - name: Run unit tests (Python)
        run: pytest tests
      - name: Build knowledge DB
        run: python scripts/build_knowledge_db.py
      - name: Build normalization map
        run: python scripts/text_normalize.py
      - name: Keyword debug
        run: python scripts/keyword_debug.py
      - name: Pick golden chunks
        run: python scripts/pick_golden_chunks.py
      - name: Upload chunks_for_golden artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunks-for-golden
          path: eval/chunks_for_golden.jsonl
      - name: Download embedding model
        run: python scripts/download_models.py
      - name: Build embeddings
        run: python scripts/build_embeddings.py
      - name: Export retrieval top5 reference (K3c)
        run: python scripts/export_retrieval_top5.py
      - name: Upload retrieval reference
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-reference
          path: |
            eval/retrieval_top5.csv
            eval/retrieval_top5.meta.json
      - name: Make reference vectors
        run: python scripts/make_reference_vectors.py
      - name: Benchmark embedder latency
        run: python scripts/benchmark_embedder.py
      - name: Print candidate alternates
        run: python scripts/print_alternates.py
      - name: Evaluate golden v3
        run: python scripts/evaluate_golden_v3.py
      - name: Failure review before label fixes
        run: python scripts/failure_review.py eval/golden_v2.draft.jsonl
      - name: Failure review after label fixes
        run: python scripts/failure_review.py eval/golden_v3.draft.jsonl
      - name: Language hygiene check
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          patterns = {
              "Hangul": r"[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]",
              "Hiragana": r"[\u3040-\u309F]",
              "Katakana": r"[\u30A0-\u30FF]",
              "CJK": r"[\u4E00-\u9FFF\u3400-\u4DBF]",
              "Cyrillic": r"[\u0400-\u04FF]",
              "Hebrew": r"[\u0590-\u05FF]",
              "Devanagari": r"[\u0900-\u097F]",
          }
          roots = ["README.md", "scripts", "tests", ".github", "app/src/main/java", "eval", "app/src/main/assets"]
          hits = 0
          for root in roots:
              p = pathlib.Path(root)
              if not p.exists():
                  continue
              for f in p.rglob("*"):
                  if not f.is_file():
                      continue
                  if "models" in f.parts:
                      continue
                  if f.suffix not in (".md", ".py", ".yml", ".yaml", ".json", ".kt", ".xml", ".toml", ".properties", ".txt", ".gradle"):
                      continue
                  try:
                      text = f.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  for name, pat in patterns.items():
                      for i, line in enumerate(text.splitlines(), start=1):
                          if re.search(pat, line):
                              print(f"{f}:{i}: {name} character found")
                              hits += 1
          if hits > 0:
              print(f"ERROR: {hits} non-allowed-script character hit(s).", file=sys.stderr)
              sys.exit(1)
          print("Language hygiene check: OK")
          PY
      - name: Measure gate signals (Stage 3.7a)
        run: python scripts/measure_gate_signals.py
      - name: Upload gate signals artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-signals-csv
          path: eval/gate_signals.csv
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
      - name: Unit tests (Android)
        run: ./gradlew testDebugUnitTest
      - name: Report retrieval parity (K3c)
        run: python scripts/report_retrieval_parity.py
      - name: Upload parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-reports
          path: build/reports/parity/
      - name: Assemble release
        run: ./gradlew assembleRelease
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          else
            keytool -genkeypair -v -keystore /tmp/keystore.jks -alias medai -keyalg RSA -keysize 2048 -validity 10000 -storepass changeit -keypass changeit -dname "CN=MedAI, O=MedAI, C=US"
            export KEYSTORE_PASSWORD=changeit
            export KEY_ALIAS=medai
            export KEY_PASSWORD=changeit
          fi
          KS_PASS=${KEYSTORE_PASSWORD:-changeit}
          ALIAS=${KEY_ALIAS:-medai}
          KP=${KEY_PASSWORD:-changeit}
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore /tmp/keystore.jks -storepass "$KS_PASS" -keypass "$KP" "$APK" "$ALIAS"
      - name: Verify APK contents
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if unzip -l "$APK" | grep -i '\.pdf$'; then echo "PDF found in APK - FAIL"; exit 1; fi
          for f in assets/books_knowledge.db assets/embeddings.bin assets/embeddings_meta.json assets/embedder_reference.json assets/models/embedder/model_quantized.onnx assets/models/embedder/tokenizer.json assets/normalize_map.json assets/fusion_config.json assets/medical_aliases.json; do
            if ! unzip -l "$APK" | grep -q "$f"; then echo "Missing $f in APK - FAIL"; exit 1; fi
          done
          if unzip -l "$APK" | grep -q 'assets/config_calibrated.json'; then echo "config_calibrated.json found in APK - FAIL"; exit 1; fi
          echo "APK contains all required assets, no .pdf and no config_calibrated.json - OK"
      - name: APK file sizes
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          TOTAL=$(stat -c%s "$APK")
          echo "### APK contents and sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size (bytes) |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in assets/books_knowledge.db assets/embeddings.bin assets/embeddings_meta.json assets/embedder_reference.json assets/models/embedder/model_quantized.onnx assets/models/embedder/tokenizer.json assets/normalize_map.json assets/fusion_config.json assets/medical_aliases.json; do
            SIZE=$(unzip -l "$APK" | awk -v f="$f" '$4 == f {print $3}')
            if [ -z "$SIZE" ]; then SIZE=0; fi
            echo "| $f | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done
          echo "| Total APK | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
