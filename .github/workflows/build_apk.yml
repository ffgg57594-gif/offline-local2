name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r scripts/requirements.txt
      - name: Run unit tests (Python)
        run: pytest tests
      - name: Build knowledge DB
        run: python scripts/build_knowledge_db.py
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
      - name: Unit tests (Android)
        run: ./gradlew testDebugUnitTest
      - name: Assemble release
        run: ./gradlew assembleRelease
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          else
            keytool -genkeypair -v -keystore /tmp/keystore.jks -alias medai -keyalg RSA -keysize 2048 -validity 10000 -storepass changeit -keypass changeit -dname "CN=MedAI, O=MedAI, C=US"
            export KEYSTORE_PASSWORD=changeit
            export KEY_ALIAS=medai
            export KEY_PASSWORD=changeit
          fi
          KS_PASS=${KEYSTORE_PASSWORD:-changeit}
          ALIAS=${KEY_ALIAS:-medai}
          KP=${KEY_PASSWORD:-changeit}
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore /tmp/keystore.jks -storepass "$KS_PASS" -keypass "$KP" "$APK" "$ALIAS"
      - name: Verify APK contents
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if unzip -l "$APK" | grep -i '\.pdf$'; then echo "PDF found in APK - FAIL"; exit 1; fi
          if ! unzip -l "$APK" | grep -q 'assets/books_knowledge.db'; then echo "books_knowledge.db missing from APK - FAIL"; exit 1; fi
          echo "APK contains books_knowledge.db and no .pdf - OK"
      - name: APK size
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIZE=$(stat -c%s "$APK")
          echo "### APK size: $SIZE bytes" >> $GITHUB_STEP_SUMMARY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
