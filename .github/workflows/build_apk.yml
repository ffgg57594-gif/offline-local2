name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['books/**', 'app/**', 'scripts/**', 'eval/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (preinstalled)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms 2>/dev/null | head
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null; df -h
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install python deps
        run: pip install pymupdf onnxruntime numpy
      - name: Download models
        run: python scripts/download_models.py
      - name: Build knowledge db
        run: python scripts/build_knowledge_db.py
      - name: Calibrate
        run: python scripts/calibrate_threshold.py
      - name: Eval gate
        run: python scripts/evaluate_retrieval.py
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleRelease
      - name: Check APK size
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIZE=$(stat -c%s "$APK")
          echo "size=$SIZE"
          test "$SIZE" -lt 1932735283
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
